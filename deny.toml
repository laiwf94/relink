# cargo-deny policy: run with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Every RustSec advisory fails the build unless listed here with a reason.
ignore = [
    # chrono is unmaintained (RUSTSEC-2026-0543). This is a notice, not a
    # vulnerability, and no version resolves it. chrono reaches the build
    # through relink-core, relink-server, sqlx's `chrono` feature and the
    # Worker's `worker` crate, so the advisory stays until relink and sqlx
    # move to `time` or `jiff`. Remove this entry then (#81).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; replacement tracked in #81" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
