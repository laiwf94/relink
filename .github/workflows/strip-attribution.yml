# Removes tool attribution lines (such as a "Generated by ..." footer) from
# issues, pull requests and comments as soon as they are posted or edited.
# Edits made with GITHUB_TOKEN do not start new workflow runs, so this never loops.
name: strip-attribution

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const patterns = [
              /\n*(?:-{3,}[ \t]*\n+)?_?(?:🤖[ \t]*)?Generated (?:by|with) \[Claude Code\]\([^)\n]*\)_?[ \t]*(?=\n|$)/gi,
              /\n*(?:-{3,}[ \t]*\n+)?_?(?:🤖[ \t]*)?Generated (?:by|with) Claude Code_?[ \t]*(?=\n|$)/gi,
              /\n*Co-Authored-By: Claude[^\n]*/gi,
              /\n*Claude-Session: [^\n]*/gi,
              /\n*https:\/\/claude\.ai\/code\/session_[A-Za-z0-9_-]+[ \t]*(?=\n|$)/g,
            ];
            const clean = (text) => {
              if (!text) return text;
              let out = text;
              for (const p of patterns) out = out.replace(p, '');
              return out.replace(/\s+$/, '');
            };
            const { owner, repo } = context.repo;
            const p = context.payload;
            let target, update;
            if (context.eventName === 'issue_comment') {
              target = p.comment;
              update = (body) => github.rest.issues.updateComment({ owner, repo, comment_id: p.comment.id, body });
            } else if (context.eventName === 'issues') {
              target = p.issue;
              update = (body) => github.rest.issues.update({ owner, repo, issue_number: p.issue.number, body });
            } else if (context.eventName === 'pull_request_target') {
              target = p.pull_request;
              update = (body) => github.rest.pulls.update({ owner, repo, pull_number: p.pull_request.number, body });
            } else if (context.eventName === 'pull_request_review_comment') {
              target = p.comment;
              update = (body) => github.rest.pulls.updateReviewComment({ owner, repo, comment_id: p.comment.id, body });
            } else {
              core.info(`Nothing to do for ${context.eventName}`);
              return;
            }
            const before = target.body || '';
            const after = clean(before);
            if (after === before.replace(/\s+$/, '') || after === before) {
              core.info('No attribution found');
              return;
            }
            if (!after.trim()) {
              core.warning('Body would be empty after stripping; leaving it unchanged');
              return;
            }
            await update(after);
            core.info(`Removed attribution from ${target.html_url}`);
