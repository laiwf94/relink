name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      RELINK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # The suite and then the coverage run write several GB of WAL into a
      # data directory of tens of thousands of files; a checkpoint that
      # starts on its own mid-run stalls queries for seconds and once held
      # a click flush past its 2 s timeout (#83, #86). This Postgres is
      # thrown away with the job, so it checkpoints only once it is done.
      - name: No Postgres checkpoints during the run
        run: |
          psql "$RELINK_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_wal_size = '8GB'" \
            -c "ALTER SYSTEM SET checkpoint_timeout = '1d'" \
            -c "SELECT pg_reload_conf()"
          psql "$RELINK_TEST_DATABASE_URL" -Atc "SHOW max_wal_size" -c "SHOW checkpoint_timeout"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage (lines >= 90%)
        run: cargo llvm-cov --summary-only --fail-under-lines 90
      - name: Benchmarks compile
        run: cargo bench --no-run

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: relink-core builds for wasm32
        run: cargo build -p relink-core --target wasm32-unknown-unknown --release
      - name: Clippy for the Worker
        run: cargo clippy -p relink-edge --target wasm32-unknown-unknown -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: worker-build@0.8.7
      - name: Worker bundle size
        working-directory: crates/relink-edge
        run: |
          worker-build --release
          echo "wasm bytes: $(wc -c < build/index_bg.wasm), gzipped: $(gzip -9 -c build/index_bg.wasm | wc -c)"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own
      # target, where sanitizers cannot link; name the gnu target explicitly.
      - name: Fuzz (short)
        run: |
          for target in destination alias headers api_input id_token host; do
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=30
          done

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
      # .cargo/audit.toml ignores an advisory for libsqlite3-sys, which is in
      # Cargo.lock only through sqlx's weak features (#78). Fail if it is
      # ever actually built.
      - name: SQLite stays out of the build
        run: |
          used=$(cargo tree --workspace --target all -e normal,build,dev -i libsqlite3-sys 2>/dev/null)
          if [ -n "$used" ]; then echo "$used"; exit 1; fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t relink .
