[package]
name = "relink-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "relink origin server: management API, Postgres storage, analytics and the in-memory redirect path."
publish = false

[lib]
name = "relink_server"


[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
chrono = { workspace = true, features = ["std", "clock"] }
getrandom = "=0.4.3"
hmac = { workspace = true }
relink-core = { path = "../relink-core" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "chrono", "json"] }
subtle = "=2.6.1"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter", "ansi"] }
url = { workspace = true }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
proptest = { workspace = true }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

