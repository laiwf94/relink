[package]
name = "relink-edge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "relink redirects at the edge: a Cloudflare Worker serving links from Workers KV."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
relink-core = { path = "../relink-core" }
serde_json = { workspace = true }

# The Worker runtime binding only exists on wasm32; the logic and its tests
# build natively without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
chrono = { workspace = true }
relink-server = { path = "../relink-server" }
tokio = { version = "=1.53.3", features = ["rt", "macros"] }
