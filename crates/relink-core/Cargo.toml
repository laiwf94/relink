[package]
name = "relink-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Redirect rules shared by the relink server and edge worker: validation, A/B assignment, geo and expiry."
publish = false

# No I/O and no runtime here: this crate must build for wasm32-unknown-unknown.
[dependencies]
chrono = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
