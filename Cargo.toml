[workspace]
resolver = "3"
members = ["crates/relink-core"]
default-members = ["crates/relink-core"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["alloc", "serde"] }
hmac = "=0.13.0"
proptest = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
url = "=2.5.8"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
debug = false
